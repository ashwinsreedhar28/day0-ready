name: Detect launches

# Every 30 minutes: look for new model-named vllm/vllm-openai tags, match each
# to a Hugging Face repo, record it in data/state.json, and start a day-0
# worker build for it.

on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      since:
        description: "first run only: ignore tag families first pushed before this date (YYYY-MM-DD)"
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: detect
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Poll Docker Hub and Hugging Face
        id: poll
        run: python3 detect/poll.py ${{ inputs.since && format('--since {0}', inputs.since) || '' }}

      - name: Commit state and board
        run: |
          git config user.name "day0-ready bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Rebuild the board on the latest branch each try (a smoke run may have
          # recorded a result meanwhile), so the board's "Last poll" stays current.
          cp data/state.json /tmp/state.json
          branch="${GITHUB_REF_NAME}"
          for i in 1 2 3; do
            git fetch -q origin "$branch" && git reset -q --hard "origin/$branch"
            cp /tmp/state.json data/state.json
            python3 detect/board.py > /dev/null
            git add data/state.json data/board.md data/ready.json
            git diff --cached --quiet && exit 0
            git commit -q -m "detect: $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -q origin "HEAD:$branch" && exit 0
            sleep 5
          done
          exit 1

      - name: Start builds for new launches
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTS: ${{ steps.poll.outputs.new_events }}
          AUTO_SMOKE: ${{ vars.AUTO_SMOKE }}
        run: |
          echo "${EVENTS:-[]}" | jq -c '.[] | select(.model != null)' | while read -r ev; do
            tag=$(jq -r .vllm_tag <<<"$ev"); model=$(jq -r .model <<<"$ev")
            echo "dispatch build: $tag -> $model"
            # GPU smoke tests after a build only with the repo variable AUTO_SMOKE=true
            # (off while the pipeline is parked, Oct 28 2026 - Jan 2027).
            gh workflow run build-day0.yml -f vllm_tag="$tag" -f model="$model" -f smoke="${AUTO_SMOKE:-false}"
          done
          echo "${EVENTS:-[]}" | jq -r '.[] | select(.model == null) | "no Hugging Face match for \(.family) (\(.vllm_tag))"'
