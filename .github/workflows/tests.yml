name: Tests

on:
  pull_request:
  push:
    paths: ["detect/**", "pipeline/**", "checks/**", "tests/**", ".github/workflows/tests.yml"]

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest pyyaml
      - run: python -m pytest tests -v
